name: Sync Kura secrets

on:
  repository_dispatch:
    types:
      - kura-secrets-release

permissions:
  contents: write

concurrency:
  group: kura-secrets-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.client_payload.source_repository ==
      format('{0}/kura-secrets', github.repository_owner) &&
      github.event.client_payload.source_branch == 'main' &&
      startsWith(github.event.client_payload.source_ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out Vaultgate
        uses: actions/checkout@v4

      - name: Check out the tagged Kura secrets
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.source_repository }}
          ref: ${{ github.event.client_payload.source_ref }}
          token: ${{ secrets.KURA_SECRETS_TOKEN }}
          path: .kura-secrets
          fetch-depth: 0

      - name: Verify the tag belongs to main
        working-directory: .kura-secrets
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Synchronize generated secrets
        run: |
          test -d .kura-secrets/KuraKeys
          mkdir -p KuraKeys
          rsync -a --delete .kura-secrets/KuraKeys/ KuraKeys/
          rm -rf .kura-secrets

      - name: Commit and push the release
        run: |
          if git diff --quiet -- KuraKeys; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all KuraKeys
          git commit -m "Sync Kura secrets from ${{ github.event.client_payload.source_ref_name }}"
          git push origin HEAD:${GITHUB_REF_NAME}
