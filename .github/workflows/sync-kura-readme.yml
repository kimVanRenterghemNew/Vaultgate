name: Test Kura README sync

on:
  repository_dispatch:
    types:
      - kura-secrets-release

permissions:
  contents: write

concurrency:
  group: kura-readme-sync
  cancel-in-progress: false

jobs:
  sync-readme:
    if: >-
      github.event.client_payload.source_repository ==
      'kimVanRenterghemNew/kura-secrets' &&
      github.event.client_payload.source_branch == 'main' &&
      startsWith(github.event.client_payload.source_ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out Vaultgate
        uses: actions/checkout@v4

      - name: Check out the tagged Kura secrets source
        uses: actions/checkout@v4
        with:
          repository: kimVanRenterghemNew/kura-secrets
          ref: ${{ github.event.client_payload.source_ref }}
          token: ${{ secrets.KURA_SECRETS_TOKEN }}
          path: .kura-secrets
          fetch-depth: 0

      - name: Verify the tag belongs to main
        working-directory: .kura-secrets
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Copy only the README
        run: cp .kura-secrets/README.md README.md

      - name: Commit and push the README
        env:
          SOURCE_REF_NAME: ${{ github.event.client_payload.source_ref_name }}
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Sync README from kura-secrets ${SOURCE_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
